# ======================================
# NETLIFY.TOML CORREGIDO
# ======================================

[build]
  publish = "."
  
# Redirects para manejar rutas correctamente
[[redirects]]
  from = "/"
  to = "/views/index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/views/index.html"
  status = 200

[[redirects]]
  from = "/profile.html"
  to = "/views/profile.html"
  status = 200

[[redirects]]
  from = "/auth.html"
  to = "/views/auth.html"
  status = 200

[[redirects]]
  from = "/participar.html"
  to = "/views/participar.html"
  status = 200

[[redirects]]
  from = "/subir-obra.html"
  to = "/views/subir-obra.html"
  status = 200

[[redirects]]
  from = "/views/*"
  to = "/views/:splat"
  status = 200

# Catch-all para SPA routing
[[redirects]]
  from = "/*"
  to = "/views/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"