[build]
  publish = "."
  
[[redirects]]
  from = "/"
  to = "/views/index.html"
  status = 200

[[redirects]]
  from = "/views/*"
  to = "/views/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"